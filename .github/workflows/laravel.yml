name: ISI Burger CI/CD

on:
  push:
    branches: [ "lo_makhmadane_burger" ]
  pull_request:
    branches: [ "lo_makhmadane_burger" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: isi_burger_test
          MYSQL_ROOT_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:

      # 1. Pull du code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Setup PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, zip, gd
          coverage: none

      # 3. Copier .env
      - name: Copy .env
        run: cp .env.example .env.testing

      # 4. Installer dépendances Laravel
      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      # 5. Générer la clé
      - name: Generate app key
        run: php artisan key:generate --env=testing

      # 6. Installer Node + builder assets
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install NPM dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      # 7. Migrations
      - name: Run migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: isi_burger_test
          DB_USERNAME: root
          DB_PASSWORD: secret
        run: php artisan migrate --force

      # 8. Build image Docker
      - name: Build Docker image
        run: docker build -t isi-burger:latest .

      # 9. Tag et push (optionnel si tu as Docker Hub)
      # - name: Push to Docker Hub
      #   run: |
      #     echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      #     docker tag isi-burger:latest ${{ secrets.DOCKER_USERNAME }}/isi-burger:latest
      #     docker push ${{ secrets.DOCKER_USERNAME }}/isi-burger:latest